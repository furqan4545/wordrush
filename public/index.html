<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>if(location.protocol==='file:')location.replace('http://127.0.0.1:4321/'+location.search);</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5eff8">
  <title>Wordrush — Make a fast-paced video</title>
  <meta name="description" content="Type your words and make a fast-paced video.">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <script type="module" src="/effects.js"></script>
</head>
<body>
  <div class="ambient ambient-lilac" aria-hidden="true"></div>
  <div class="ambient ambient-peach" aria-hidden="true"></div>
  <header class="site-header">
    <a href="/" class="wordmark" aria-label="Wordrush home"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>wordrush<span class="wordmark-period">.</span></a>
  </header>
  <main>
    <section class="workspace" aria-label="Video creator">
      <div class="creation-panel">
        <h1>Make a<br><em>fast-paced video.</em></h1>
        <form id="creator-form" autocomplete="off">
          <label class="sr-only" for="word">Your phrase</label>
          <div class="search-shell">
            <div id="search-glow-root" aria-hidden="true"></div>
            <div class="search-content">
              <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.7 4.7" stroke-linecap="round"/></svg>
              <input id="word" name="word" type="text" value="" placeholder="How to…" autocomplete="off" spellcheck="false" aria-describedby="word-help word-count">
              <button class="create-button" id="create-button" type="submit" aria-label="Create my video"><span id="create-label">Create</span><span id="create-arrow" aria-hidden="true">↗</span></button>
            </div>
          </div>
          <div class="field-meta"><span id="word-help" aria-live="polite"></span><span id="word-count">0 / 8 words</span></div>
          <div class="examples"><span>Try</span><button type="button" data-word="find me clarity">find me clarity</button><button type="button" data-word="peace of mind">peace of mind</button><button type="button" data-word="a little more courage">a little more courage</button></div>
          <details class="fine-tune">
            <summary>Make it yours <span aria-hidden="true">+</span></summary>
            <div class="motion-control"><label for="intensity">The rush</label><output id="motion-value" for="intensity">Punchy</output><input id="intensity" type="range" min="0" max="100" value="75"><div class="range-labels"><span>Gentle</span><span>Full rush</span></div></div>
          </details>
          <p id="form-error" class="form-error" role="alert" hidden></p>
        </form>
        <div class="render-progress" id="render-progress" hidden aria-live="polite">
          <div class="render-orbit">
            <div id="voice-ring-root" aria-hidden="true"></div>
            <span id="progress-percent" class="progress-percent">0%</span>
          </div>
          <strong id="progress-label">Making your moment</strong>
          <div class="progress-track sr-only"><div id="progress-fill"></div></div>
          <p id="progress-note" class="sr-only">Your video is rendering.</p>
        </div>
        <section id="generated-result" class="generated-result" hidden aria-label="Your video result">
          <div class="generated-heading">YOUR VIDEO</div>
          <div class="finished-card" id="finished-card" hidden aria-live="polite"><span class="finished-icon" aria-hidden="true">✓</span><div><strong id="finished-title">Your video is ready.</strong><p id="finished-subtitle" class="sr-only">Ready to download</p></div><a id="download-link" class="download-button" download>Download <span aria-hidden="true">↓</span></a></div>
          <div class="generated-video-shell"><video id="rendered-video" aria-label="Your generated video" controls playsinline preload="metadata"></video></div>
          <details class="source-details" id="source-details" hidden><summary><span id="source-summary">50 edited website frames</span><span aria-hidden="true">↗</span></summary><p id="source-caption"></p><div id="source-list" class="source-list"></div></details>
        </section>
      </div>
      <div class="preview-panel">
        <div class="preview-heading"><span class="preview-status"><span class="live-dot" aria-hidden="true"></span><span>EXAMPLE VIDEO</span></span><span>9:16</span></div>
        <div class="preview-frame">
          <div class="video-shell">
            <video id="example-video" src="/demo-how-to-v13.mp4" aria-label="Example video" controls playsinline preload="metadata" muted loop controlslist="nodownload"></video>
          </div>
        </div>
      </div>
    </section>
    <details class="video-history"><summary>Your videos <span aria-hidden="true">↗</span></summary><section id="recent-section" class="recent-section" hidden aria-labelledby="recent-heading"><h2 id="recent-heading" class="sr-only">Your recent videos</h2><div id="recent-list" class="recent-list"></div></section></details>
  </main>
  <footer><span>Wordrush</span><span class="footer-mark" aria-hidden="true">✳</span></footer>
</body>
</html>
